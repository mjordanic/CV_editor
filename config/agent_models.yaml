# Agent Model Configuration
# This file defines which model each agent uses (any provider init_chat_model supports, e.g.
# "openai:..." or "ollama:..."). CV_EDITOR_MODEL overrides every model here; see README.md.
#
# Every agent uses gpt-6-luna. OpenAI list prices per 1M tokens, read 2026-11-09 from
# https://developers.openai.com/api/docs/pricing (input / cached input / output):
#   gpt-6-luna   $0.10 / $0.01  / $0.50
#   gpt-5-nano   $0.05 / $0.005 / $0.40   (the previous default)
#   gpt-5.6-luna $0.20 / $0.02  / $1.20
#   gpt-5.4-nano $0.20 / $0.02  / $1.25
# In the same scripted session on the fictional samples (2026-11-09), gpt-6-luna cost $0.017 and
# took 4 minutes, and its CV and cover letter claimed nothing the candidate's material lacks.
# gpt-5-nano cost $0.113 and took 31 minutes (most of its output is hidden reasoning) and still
# needed the grounding check to keep invented skills out. gpt-5.6-luna was also clean, at $0.053.
#
# gpt-6-luna accepts only its default temperature, so `temperature: null` (the model default).

# Workflow Settings
workflow:
  max_refinements: 1  # critique-driven redrafts per document before finalizing; keep small, each one costs LLM calls and time
  max_refinements_hard_cap: 2  # absolute limit: one extra redraft only if the last one raised the score by >= quality_improvement_threshold
  quality_improvement_threshold: 5
  max_latex_fix_iterations: 2

agents:
  cv_writer:
    model: "openai:gpt-6-luna"
    temperature: null
    filter_model: "openai:gpt-6-luna"
    filter_temperature: null
    description: "Writes and redrafts the tailored CV; the filter model drops critique suggestions that clash with the user's earlier requests"

  cover_letter_writer:
    model: "openai:gpt-6-luna"
    temperature: null
    filter_model: "openai:gpt-6-luna"
    filter_temperature: null
    description: "Writes and redrafts the cover letter; the filter model works as for cv_writer"

  critique:
    model: "openai:gpt-6-luna"
    temperature: null
    quality_threshold: 85
    description: "Scores each draft, writes redraft instructions and runs the grounding check (claims the candidate's own material does not support)"

  router:
    model: "openai:gpt-6-luna"
    temperature: null
    description: "Talks to the user and decides the next step"

  job_description:
    model: "openai:gpt-6-luna"
    temperature: null
    description: "Extracts structured fields from the job ad"

  search:
    model: "openai:gpt-6-luna"
    temperature: null
    description: "Summarises Tavily search results into a company description"

  # Agents without a model
  document_reader:
    model: null
    temperature: null
    description: "Reads the CV and cover letter files (PDF or text)"

  user_input:
    model: null
    temperature: null
    description: "Collects user input via interrupts"

  rag:
    model: "openai:gpt-6-luna"
    temperature: null
    similarity_threshold: 1.5
    description: "Checks whether retrieved portfolio items are relevant to the job"
    rationale: "Threshold 1.5 (L2 distance) keeps loosely similar items; the model check then filters them. Embeddings use OpenAI text-embedding-3-small (or an Ollama embedding model for ollama: models)."

  template_customizer:
    model: "openai:gpt-6-luna"
    temperature: null
    description: "Turns the final CV / cover letter text into LaTeX, applying the user's style requests"

  latex_fixer:
    model: "openai:gpt-6-luna"
    temperature: null
    description: "Repairs LaTeX documents based on pdflatex error output so they compile"
