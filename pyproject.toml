[project]
name = "cv-editor"
version = "0.1.0"
description = "Command-line assistant that tailors your CV and cover letter to a job ad and renders them as PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "langgraph",
    "langchain",
    "langchain-community",
    "ipykernel>=7.1.0",
    "langchain-openai>=1.0.2",
    "pypdf>=6.2.0",
    "pdfplumber>=0.11.8",
    "tavily>=1.1.0",
    "faiss-cpu>=1.15.1",
    "langchain-ollama>=1.0,<1.1",
    "anthropic>=2.8.0",
]

[project.optional-dependencies]
# Only needed to redraw images/graph_visualization.png (python langgraph_agent.py --draw-graph).
# Requires the Graphviz system library; see README.md.
graph = [
    "pygraphviz>=1.14",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
